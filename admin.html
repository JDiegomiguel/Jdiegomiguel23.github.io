<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Examen de Cultura Digital</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #dd903c;
            color: white;
            padding: 15px;
            text-align: center;
        }
        main {
            padding: 20px;
        }
        table {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #dd903c;
            color: white;
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database.js"></script>
</head>
<body>
    <header>
        <h1>Panel de Administración - Examen de Cultura Digital</h1>
    </header>

    <main>
        <h2>Resultados de los Estudiantes</h2>
        <table id="exam-table">
            <thead>
                <tr>
                    <th>Nombre del Estudiante</th>
                    <th>Resultado</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>

    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCKSGF4Sny9K_-zC7dl96o1eOhmw2nvrpE",
            authDomain: "examen-c2601.firebaseapp.com",
            databaseURL: "https://examen-c2601-default-rtdb.firebaseio.com",
            projectId: "examen-c2601",
            storageBucket: "examen-c2601.firebasestorage.app",
            messagingSenderId: "183710876262",
            appId: "1:183710876262:web:94e1a10c774413e5f0a3a7"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const examTable = document.getElementById('exam-table').getElementsByTagName('tbody')[0];

        // Obtener resultados en el panel de administración
        firebase.database().ref('exams').on('value', function(snapshot) {
            const data = snapshot.val();
            examTable.innerHTML = ''; // Limpiar la tabla antes de agregar nuevos datos

            for (const key in data) {
                const row = examTable.insertRow();
                const cell1 = row.insertCell(0);
                const cell2 = row.insertCell(1);

                cell1.textContent = `Estudiante ${key}`;
                cell2.textContent = `${data[key].score} de ${data[key].totalQuestions}`;
            }
        });
    </script>
</body>
</html>
