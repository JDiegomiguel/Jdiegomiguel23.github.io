<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Examen de Cultura Digital</title>
  <style>
    body {
      background-color: #ffffff;
      font-family: Arial, sans-serif;
      color: #333;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #dd903c;
    }

    .pregunta {
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 15px;
      padding: 10px;
      background-color: #fdf7f1;
    }

    button {
      background-color: #dd903c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      display: block;
      margin: 20px auto;
    }

    #notificacion {
      text-align: center;
      font-weight: bold;
      color: green;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h1>Examen de Cultura Digital</h1>
  <div id="preguntas"></div>
  <button onclick="enviarExamen()">Enviar Examen</button>
  <div id="notificacion"></div>

  <!-- Firebase y lógica -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCKSGF4Sny9K_-zC7dl96o1eOhmw2nvrpE",
      authDomain: "examen-c2601.firebaseapp.com",
      databaseURL: "https://examen-c2601-default-rtdb.firebaseio.com",
      projectId: "examen-c2601",
      storageBucket: "examen-c2601.appspot.com",
      messagingSenderId: "183710876262",
      appId: "1:183710876262:web:94e1a10c774413e5f0a3a7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const preguntas = [
      { texto: "1. ¿Qué es la cultura digital?", opciones: ["Conjunto de conocimientos digitales", "Lenguaje informal", "Solo redes sociales", "Una tribu tecnológica"] },
      { texto: "2. ¿Cuál es un ejemplo de herramienta digital?", opciones: ["Internet", "Lápiz", "Papel", "Pizarra"] },
      { texto: "3. ¿Qué significa ser un ciudadano digital responsable?", opciones: ["Usar internet con ética", "Hackear páginas", "Usar redes sin pensar", "Evitar contraseñas"] },
      { texto: "4. ¿Qué es una red social?", opciones: ["Plataforma para interactuar", "Página de compras", "Enciclopedia", "Programa de TV"] },
      { texto: "5. ¿Cuál es una buena práctica de seguridad digital?", opciones: ["Usar contraseñas seguras", "Compartir datos", "Abrir correos sospechosos", "Conectarse a WiFi desconocido"] },
      { texto: "6. ¿Qué es la huella digital?", opciones: ["Rastro que dejas en internet", "Marca de un dedo", "Firma digitalizada", "Nombre de usuario"] },
      { texto: "7. ¿Qué es el software?", opciones: ["Programas de computadora", "Partes físicas", "Cable de red", "Memoria RAM"] },
      { texto: "8. ¿Qué es el hardware?", opciones: ["Partes físicas de un equipo", "Programas del sistema", "Base de datos", "Redes sociales"] },
      { texto: "9. ¿Cuál es una forma de comunicarse digitalmente?", opciones: ["Correo electrónico", "Cartas postales", "Teléfono fijo", "Pintura rupestre"] },
      { texto: "10. ¿Qué es el phishing?", opciones: ["Engaño para obtener datos", "Navegador web", "Software de seguridad", "Tipo de red"] },
      { texto: "11. ¿Qué es una URL?", opciones: ["Dirección de una página web", "Lenguaje de programación", "Antivirus", "Base de datos"] },
      { texto: "12. ¿Qué es una VPN?", opciones: ["Red privada virtual", "Programa de dibujo", "Antivirus", "Red social"] },
      { texto: "13. ¿Qué se necesita para conectarse a internet?", opciones: ["Módem y proveedor", "Microscopio", "TV", "CD-ROM"] },
      { texto: "14. ¿Qué es un navegador web?", opciones: ["Programa para ver páginas web", "Base de datos", "Sistema operativo", "Antena"] },
      { texto: "15. ¿Qué es la nube?", opciones: ["Almacenamiento en internet", "El cielo", "Disco duro", "Correo"] },
      { texto: "16. ¿Qué es una contraseña segura?", opciones: ["Mezcla de letras, números y símbolos", "1234", "tu nombre", "abc"] },
      { texto: "17. ¿Qué es el ciberacoso?", opciones: ["Acoso en internet", "Ayuda digital", "Corrección en línea", "Hackeo ético"] },
      { texto: "18. ¿Qué es un archivo PDF?", opciones: ["Formato de documento", "Foto", "Video", "Página web"] },
      { texto: "19. ¿Qué es un antivirus?", opciones: ["Programa que detecta amenazas", "Virus de computadora", "PDF seguro", "Red interna"] },
      { texto: "20. ¿Qué es una IP?", opciones: ["Identificador de una red", "Correo electrónico", "Navegador", "Nombre de usuario"] },
      { texto: "21. ¿Cuál es el propósito de un sistema operativo?", opciones: ["Gestionar hardware y software", "Enviar correos", "Dibujar", "Tomar fotos"] },
      { texto: "22. ¿Qué es un archivo comprimido?", opciones: ["Archivo con menos tamaño", "PDF", "Virus", "Foto"] },
      { texto: "23. ¿Qué significa streaming?", opciones: ["Ver contenido en línea", "Descargar", "Chatear", "Comprimir"] },
      { texto: "24. ¿Qué es un dominio web?", opciones: ["Nombre de una página", "Red local", "Software", "VPN"] },
      { texto: "25. ¿Qué significa CC en un correo?", opciones: ["Copia para otro destinatario", "Carpeta compartida", "Correo cancelado", "Copia de CD"] },
      { texto: "26. ¿Qué es un código QR?", opciones: ["Código escaneable", "Virus", "Correo", "Sitio web"] },
      { texto: "27. ¿Qué es un blog?", opciones: ["Sitio para publicar textos", "Juego", "Red social", "Antivirus"] },
      { texto: "28. ¿Qué es la netiqueta?", opciones: ["Normas de comportamiento digital", "Idioma de red", "Usuario falso", "Antivirus"] },
      { texto: "29. ¿Qué es un foro digital?", opciones: ["Espacio para debatir en línea", "Tienda", "Red física", "Correo"] },
      { texto: "30. ¿Qué es una actualización de software?", opciones: ["Mejoras al programa", "Virus", "Borrado", "Desinstalación"] }
    ];

    window.onload = () => {
      let nombre = sessionStorage.getItem("nombre");
      if (!nombre) {
        nombre = prompt("Ingresa tu nombre:");
        if (!nombre) {
          alert("Debes ingresar un nombre.");
          location.reload();
        }
        sessionStorage.setItem("nombre", nombre);
      }

      const contenedor = document.getElementById("preguntas");
      preguntas.forEach((pregunta, index) => {
        const div = document.createElement("div");
        div.className = "pregunta";
        div.innerHTML = `
          <p><strong>${pregunta.texto}</strong></p>
          ${pregunta.opciones.map(
            (op, i) => `
              <label>
                <input type="radio" name="p${index}" value="${op}" />
                ${String.fromCharCode(65 + i)}) ${op}
              </label><br>`
          ).join("")}
        `;
        contenedor.appendChild(div);
      });
    };

    window.enviarExamen = function () {
      const nombre = sessionStorage.getItem("nombre");
      const respuestas = {};
      const preguntas = document.querySelectorAll(".pregunta");

      preguntas.forEach((preguntaDiv, i) => {
        const seleccionada = preguntaDiv.querySelector("input[type='radio']:checked");
        respuestas[`pregunta_${i + 1}`] = seleccionada ? seleccionada.value : "Sin respuesta";
      });

      const datos = {
        nombre,
        hora: new Date().toLocaleTimeString(),
        respuestas
      };

      const timestamp = Date.now();
      set(ref(db, `examenes/${nombre}_${timestamp}`), datos)
        .then(() => {
          document.getElementById("notificacion").textContent = "✅ Examen enviado correctamente.";
          document.querySelector("button").disabled = true;
        })
        .catch((error) => {
          document.getElementById("notificacion").textContent = "❌ Error al enviar: " + error.message;
        });
    };
  </script>
</body>
</html>
